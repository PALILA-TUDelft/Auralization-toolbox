# -----------------------------------------------------------------------------------------------
# Case description: Scenario 7 - CONSTANT temperature (20 C), CONSTANT WIND (10 m/s, diagonal), soft ground, mono (no binaural)
# Purpose: MATLAB/Python cross-check of the constant wind profile combined with a constant temperature profile.
#          The wind direction [1 1 0] is NOT a unit vector, so the normalisation (with its warning) is exercised
#          on both sides, and it is neither along nor across the flight track (3D refraction).
# Date:
# -----------------------------------------------------------------------------------------------

# --- Master auralization parameters ---
sampling_freq	=	48000
trim_time	=	15
#attenuation_db	=	0
binaural_signal	=	0
head_orientation =	0

# --- Buzzsaw noise synthesis ---
max_rotations_per_minute	=	4998
n_harmonics	=	101

# --- Atmospheric and sound propagation parameters ---
# nfft	=	16384

# wind settings (String: 'zero', 'constant', 'log')
wind_profile	=	constant

# Wind velocity for Const Wind Profile [m/s] (ART default: 20)
const_wind_velocity	=	10

# Normal in wind direction [x y z] (horizontal; not normalised on purpose -> the code normalises it)
const_wind_direction	=	[1 1 0]

# temperature settings (String: 'constant', 'isa')
temperature_profile	=	constant

# Temperature for Const mode, in degree Celsius (ignored when profile = isa)
temperature_celsius	=	20

# Static pressure used in a constant temperature profile [Pa] (ignored when profile = isa)
const_static_pressure	=	101325

# humidity settings (String: 'constant')
humidity_profile	=	constant

# Constant Relative Humidity [%]
const_rel_humidity	=	50

# consider ground reflection (0 = direct only, 1 = direct + 1st order reflection)
consider_ground_reflection	=	1

# effective flow resistance [kg*s^-1*m^-3] -> soft ground
sigma_e	=	50e3
