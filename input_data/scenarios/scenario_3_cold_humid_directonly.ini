# -----------------------------------------------------------------------------------------------
# Case description: Scenario 3 - Cold, humid constant atmosphere, DIRECT PATH ONLY (no ground reflection)
# Purpose: MATLAB/Python cross-check of the direct-path-only branch (ground reflection disabled),
#          with low temperature and high humidity to stress the air-attenuation model.
# Date:
# -----------------------------------------------------------------------------------------------

# --- Master auralization parameters ---
sampling_freq	=	48000
trim_time	=	20
#attenuation_db	=	0
binaural_signal	=	0
head_orientation =	0

# --- Buzzsaw noise synthesis ---
max_rotations_per_minute	=	4998
n_harmonics	=	101

# --- Atmospheric and sound propagation parameters ---
# nfft	=	16384

# wind settings (String: 'zero', 'constant', 'log')
wind_profile	=	zero

# temperature settings (String: 'constant', 'isa')
temperature_profile	=	constant

# Temperature for Const mode, in degree Celsius
temperature_celsius	=	5

# Static pressure used in a constant temperature profile [Pa]
const_static_pressure	=	101325

# humidity settings (String: 'constant')
humidity_profile	=	constant

# Constant Relative Humidity [%]
const_rel_humidity	=	90

# consider ground reflection (0 = direct only, 1 = direct + 1st order reflection)
consider_ground_reflection	=	0

# effective flow resistance [kg*s^-1*m^-3] -> grass (unused when ground reflection = 0)
sigma_e	=	250e3
