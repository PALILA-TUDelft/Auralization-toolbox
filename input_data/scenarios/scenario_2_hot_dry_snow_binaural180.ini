# -----------------------------------------------------------------------------------------------
# Case description: Scenario 2 - Hot, dry constant atmosphere, soft snow ground, binaural (head @ 180 deg)
# Purpose: MATLAB/Python cross-check with high temperature, low humidity, a very absorptive ground
#          and the binaural HRTF path enabled with the head pointing to -x.
# Date:
# -----------------------------------------------------------------------------------------------

# --- Master auralization parameters ---
sampling_freq	=	48000
trim_time	=	10
#attenuation_db	=	0
binaural_signal	=	1
head_orientation =	180

# --- Buzzsaw noise synthesis ---
max_rotations_per_minute	=	4998
n_harmonics	=	201

# --- Atmospheric and sound propagation parameters ---
# nfft	=	16384

# wind settings (String: 'zero', 'constant', 'log')
wind_profile	=	zero

# temperature settings (String: 'constant', 'isa')
temperature_profile	=	constant

# Temperature for Const mode, in degree Celsius
temperature_celsius	=	35

# Static pressure used in a constant temperature profile [Pa]
const_static_pressure	=	101325

# humidity settings (String: 'constant')
humidity_profile	=	constant

# Constant Relative Humidity [%]
const_rel_humidity	=	20

# consider ground reflection (0 = direct only, 1 = direct + 1st order reflection)
consider_ground_reflection	=	1

# effective flow resistance [kg*s^-1*m^-3] -> snow
sigma_e	=	25e3
