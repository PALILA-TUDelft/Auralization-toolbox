# -----------------------------------------------------------------------------------------------
# Case description: Scenario 10 - two receivers, ISA atmosphere, grass ground, binaural (head @ 90 deg)
# Purpose: MATLAB/Python cross-check with exactly two receivers: under the flight track and
#          further along the track at a different height. Uses its own source data, in
#          input_data/scenario_inputs/<this scenario> (see verification/generate_multi_receiver_input.py).
# Date:
# -----------------------------------------------------------------------------------------------

# --- Master auralization parameters ---
sampling_freq	=	48000
trim_time	=	10
#attenuation_db	=	0
binaural_signal	=	1
head_orientation =	90

# --- Buzzsaw noise synthesis ---
max_rotations_per_minute	=	4998
n_harmonics	=	201

# --- Atmospheric and sound propagation parameters ---
# nfft	=	16384

# wind settings (String: 'zero', 'constant', 'log')
wind_profile	=	zero

# temperature settings (String: 'constant', 'isa')
temperature_profile	=	isa

# Temperature for Const mode, in degree Celsius (ignored when profile = isa)
temperature_celsius	=	15

# Static pressure used in a constant temperature profile [Pa] (ignored when profile = isa)
const_static_pressure	=	101325

# humidity settings (String: 'constant')
humidity_profile	=	constant

# Constant Relative Humidity [%]
const_rel_humidity	=	60

# consider ground reflection (0 = direct only, 1 = direct + 1st order reflection)
consider_ground_reflection	=	1

# effective flow resistance [kg*s^-1*m^-3] -> grass
sigma_e	=	200e3
