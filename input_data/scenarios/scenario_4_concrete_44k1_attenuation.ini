# -----------------------------------------------------------------------------------------------
# Case description: Scenario 4 - Concrete ground, 44.1 kHz sampling, output attenuation applied, binaural (head @ 270 deg)
# Purpose: MATLAB/Python cross-check at a non-default sampling frequency with a clipping-avoidance
#          attenuation factor and a hard concrete ground. Binaural head points to -y.
# Date:
# -----------------------------------------------------------------------------------------------

# --- Master auralization parameters ---
sampling_freq	=	44100
trim_time	=	20

# attenuation factor [dB] applied to avoid .wav clipping (dBFS no longer equals Pa)
attenuation_db	=	-10

binaural_signal	=	1
head_orientation =	270

# --- Buzzsaw noise synthesis ---
max_rotations_per_minute	=	4998
n_harmonics	=	201

# --- Atmospheric and sound propagation parameters ---
# nfft	=	16384

# wind settings (String: 'zero', 'constant', 'log')
wind_profile	=	zero

# temperature settings (String: 'constant', 'isa')
temperature_profile	=	constant

# Temperature for Const mode, in degree Celsius
temperature_celsius	=	25

# Static pressure used in a constant temperature profile [Pa]
const_static_pressure	=	101325

# humidity settings (String: 'constant')
humidity_profile	=	constant

# Constant Relative Humidity [%]
const_rel_humidity	=	50

# consider ground reflection (0 = direct only, 1 = direct + 1st order reflection)
consider_ground_reflection	=	1

# effective flow resistance [kg*s^-1*m^-3] -> concrete
sigma_e	=	50000e3
