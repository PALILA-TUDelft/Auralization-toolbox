# -----------------------------------------------------------------------------------------------
# Case description: Scenario 8 - broadband spectral SMOOTHING (2 iterations), constant atmosphere, mono
# Purpose: MATLAB/Python cross-check of the smoothing iterations in ConvertFreqBands (1/3-octave band -> narrowband
#          conversion of the broadband engine and airframe noise). All other settings are plain (no wind, mono),
#          so any difference is due to the smoothing. The verification compares the narrowband spectrum AFTER
#          smoothing (bbn_narrowband: SPL_narrowband_smoothed), which the other scenarios do not exercise.
# Date:
# -----------------------------------------------------------------------------------------------

# --- Master auralization parameters ---
sampling_freq	=	48000
trim_time	=	15
#attenuation_db	=	0
binaural_signal	=	0
head_orientation =	0

# --- Buzzsaw noise synthesis ---
max_rotations_per_minute	=	4998
n_harmonics	=	101

# number of smoothing iterations during the conversion from 1/3-octave bands to narrowband (default: 0)
smoothings_emission_based	=	2

# --- Atmospheric and sound propagation parameters ---
# nfft	=	16384

# wind settings (String: 'zero', 'constant', 'log')
wind_profile	=	zero

# temperature settings (String: 'constant', 'isa')
temperature_profile	=	constant

# Temperature for Const mode, in degree Celsius (ignored when profile = isa)
temperature_celsius	=	15

# Static pressure used in a constant temperature profile [Pa] (ignored when profile = isa)
const_static_pressure	=	101325

# humidity settings (String: 'constant')
humidity_profile	=	constant

# Constant Relative Humidity [%]
const_rel_humidity	=	50

# consider ground reflection (0 = direct only, 1 = direct + 1st order reflection)
consider_ground_reflection	=	1

# effective flow resistance [kg*s^-1*m^-3] -> grass
sigma_e	=	200e3
