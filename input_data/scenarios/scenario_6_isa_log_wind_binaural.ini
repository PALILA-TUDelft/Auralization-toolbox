# -----------------------------------------------------------------------------------------------
# Case description: Scenario 6 - ISA atmosphere, LOGARITHMIC WIND profile (non-default parameters), grass ground, binaural (head @ 0 deg)
# Purpose: MATLAB/Python cross-check of the wind-refracted ray tracing. The log wind blows along -x
#          with a friction velocity and surface roughness different from the ART defaults, so that
#          parsing of all wind keys (incl. the direction vector) is exercised on both sides.
#          Wind changes ray paths, propagation times and launch angles (=> HRTF angles), hence binaural is on.
# Date:
# -----------------------------------------------------------------------------------------------

# --- Master auralization parameters ---
sampling_freq	=	48000
trim_time	=	20
#attenuation_db	=	0
binaural_signal	=	1
head_orientation =	0

# --- Buzzsaw noise synthesis ---
max_rotations_per_minute	=	4998
n_harmonics	=	151

# --- Atmospheric and sound propagation parameters ---
# nfft	=	16384

# wind settings (String: 'zero', 'constant', 'log')
wind_profile	=	log

# Normal in wind direction [x y z] (horizontal; here: wind blowing towards -x)
const_wind_direction	=	[-1 0 0]

# Surface Roughness for Log Wind Profile [m] (ART default: 0.1)
surface_roughness	=	0.05

# Friction velocity for Log Wind Profile [m/s] (ART default: 0.6)
friction_velocity	=	0.4

# temperature settings (String: 'constant', 'isa')
temperature_profile	=	isa

# Temperature for Const mode, in degree Celsius (ignored when profile = isa)
temperature_celsius	=	15

# Static pressure used in a constant temperature profile [Pa] (ignored when profile = isa)
const_static_pressure	=	101325

# humidity settings (String: 'constant')
humidity_profile	=	constant

# Constant Relative Humidity [%]
const_rel_humidity	=	60

# consider ground reflection (0 = direct only, 1 = direct + 1st order reflection)
consider_ground_reflection	=	1

# effective flow resistance [kg*s^-1*m^-3] -> grass
sigma_e	=	200e3
