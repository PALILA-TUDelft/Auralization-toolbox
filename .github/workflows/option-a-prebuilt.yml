# Tests BUILD.md Option A: a user with Python 3.13 on Windows downloads the
# prebuilt binaries, unpacks them into bin/ and runs a ray trace. The job clones
# WITHOUT submodules and never builds anything, so it only passes if the zip is
# complete.
#
# Where the binaries come from (pick one when you start the run):
#   - nothing filled in : the latest GitHub Release, asset art-win-amd64-py313.zip
#   - zip_url           : any direct download link to that zip
#   - build_run_id      : the artifact of an earlier "Fresh-clone build (Windows)"
#                         run (the number at the end of that run's URL). Use this
#                         before a Release exists.
#
# Limit: GitHub's Windows runner already has the Visual C++ runtime installed,
# so this cannot show whether a machine WITHOUT it fails (BUILD.md step 1 of
# Option A covers that case).
name: Option A check (prebuilt binaries, Windows)

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: 'Direct URL of art-win-amd64-py313.zip (empty = latest GitHub Release)'
        required: false
        default: ''
      build_run_id:
        description: 'Or: run ID of a "Fresh-clone build (Windows)" run whose artifact to test'
        required: false
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  option-a:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Clone (no submodules, as a user of Option A would)
        uses: actions/checkout@v4

      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Python packages
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'   # pip warnings go to stderr; judge by exit code only
          python -m pip install -r requirements.txt

      - name: Get the prebuilt binaries into bin/
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP_URL: ${{ inputs.zip_url }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
        run: |
          # The runner's default is 'Stop', under which Windows PowerShell 5.1 aborts on ANY
          # text a native program (gh) writes to stderr, with an empty error message. Use
          # 'Continue', print gh's output ourselves and check exit codes explicitly.
          $ErrorActionPreference = 'Continue'
          function Fail($msg) { Write-Host "::error::$msg"; exit 1 }
          function Gh { & gh @args 2>&1 | ForEach-Object { "$_" } | Write-Host }

          New-Item -ItemType Directory -Force bin | Out-Null
          if ($env:BUILD_RUN_ID) {
            Write-Host "Using artifact art-win-amd64-py313 of run $env:BUILD_RUN_ID"
            Gh run download $env:BUILD_RUN_ID --repo $env:GITHUB_REPOSITORY --name art-win-amd64-py313 --dir bin
            if ($LASTEXITCODE -ne 0) { Fail 'artifact download failed (expired after 14 days, or wrong run ID?)' }
          } else {
            $zip = Join-Path $env:RUNNER_TEMP 'art-win-amd64-py313.zip'
            if ($env:ZIP_URL) {
              Write-Host "Downloading $env:ZIP_URL"
              Invoke-WebRequest -Uri $env:ZIP_URL -OutFile $zip
            } else {
              Write-Host 'No zip_url or build_run_id given: using the latest GitHub Release'
              Gh release download --repo $env:GITHUB_REPOSITORY --pattern art-win-amd64-py313.zip --dir $env:RUNNER_TEMP --clobber
              if ($LASTEXITCODE -ne 0) { Fail 'No Release with an art-win-amd64-py313.zip asset exists yet. Run the workflow again and fill in build_run_id (or zip_url).' }
            }
            Expand-Archive -Path $zip -DestinationPath bin -Force
          }

      - name: Contents of bin/
        shell: powershell
        run: |
          $files = Get-ChildItem bin -File
          $files | Select-Object Name, Length | Format-Table -AutoSize
          Write-Host "$($files.Count) files"
          foreach ($need in '_art_core.cp313-win_amd64.pyd', 'ITAGeo.dll', 'ITAPropagationPathSim.dll') {
            if (-not (Test-Path (Join-Path bin $need))) { throw "missing from the archive: $need" }
          }
          # the files must sit directly in bin/, not in a sub-folder
          if (Get-ChildItem bin -Directory) { throw 'bin/ contains a sub-folder: the zip should unpack flat' }
          # Option A users have no build tree; make sure nothing else could satisfy the loader
          if (Test-Path ITAGeometricalAcoustics\out) { throw 'an ITA build tree exists; the test would not be clean' }

      - name: Ray-trace check (expects 2 rays, [0, 1])
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'   # Python warnings go to stderr; judge by exit code only
          @'
          from auralization.private.propagation.art_bindings import art_core_available, create_atmosphere_json, find_eigenrays
          assert art_core_available(), "ART module not found"
          rays = find_eigenrays(create_atmosphere_json(), [0, 0, 300], [500, 0, 2], {"maxReflectionOrder": 1})
          out = (len(rays), [r.numReflections for r in rays])
          print(out)
          assert out == (2, [0, 1]), out
          '@ | python -
